name: Compilar Batidinha do Rick

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Verificar e compilar
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./batidinha-rick-2.0-atualizado

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ./batidinha-rick-2.0-atualizado/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Compilar projeto
        run: npm run build
