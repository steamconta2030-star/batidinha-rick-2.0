name: Compilar e publicar Batidinha do Rick

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Compilar projeto
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./batidinha-rick-2.0-atualizado

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ./batidinha-rick-2.0-atualizado/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Compilar para o GitHub Pages
        run: npm run build -- --base=/batidinha-rick-2.0/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar site compilado
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./batidinha-rick-2.0-atualizado/dist

  deploy:
    name: Publicar site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
