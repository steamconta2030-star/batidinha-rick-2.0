name: Batidinha CI

on:
  push:
    branches: [main, hardening-batidinha-2]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: batidinha-rick-2.0-atualizado
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: batidinha-rick-2.0-atualizado/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
